[project]
name = "argus-qa"
version = "0.1.0"
description = "AI-powered UI testing swarm using Claude Agent SDK and Playwright"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "hipjim"},
]
keywords = ["testing", "ai", "playwright", "claude", "ui-testing", "qa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "claude-agent-sdk",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/hipjim/argus-qa"
Repository = "https://github.com/hipjim/argus-qa"
Issues = "https://github.com/hipjim/argus-qa/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus_qa*"]

[project.scripts]
argus-qa = "argus_qa.cli:main"
