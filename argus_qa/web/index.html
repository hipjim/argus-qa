<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>argus-qa</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 16c4-7 9-10 14-10s10 3 14 10c-4 7-9 10-14 10S6 23 2 16z' fill='none' stroke='%230e6f7a' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230e6f7a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/runs" aria-label="argus-qa home">
      <svg class="brand-eye" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M2 16c4-7 9-10 14-10s10 3 14 10c-4 7-9 10-14 10S6 23 2 16z"/>
        <circle cx="16" cy="16" r="5"/>
      </svg>
      <span>argus<span class="brand-dim">-qa</span></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/runs" data-nav="runs">Runs</a>
      <a href="#/projects" data-nav="projects">Projects</a>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="key-btn" type="button" title="API key" aria-label="API key">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>
      </button>
      <a class="btn btn-primary" href="#/runs/new">New run</a>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <dialog id="key-dialog" class="dialog">
    <form method="dialog" id="key-form">
      <h2>API key</h2>
      <p class="muted">This server requires the key set in <code>ARGUS_API_KEY</code>. It's stored in this browser only.</p>
      <label class="field">
        <span>Key</span>
        <input type="password" id="key-input" autocomplete="off" required>
      </label>
      <div class="dialog-actions">
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn btn-primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="lightbox" class="lightbox" aria-label="Screenshot">
    <form method="dialog"><button class="lightbox-close" aria-label="Close">×</button></form>
    <img id="lightbox-img" alt="">
    <p id="lightbox-caption"></p>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/static/vendor/marked.umd.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
